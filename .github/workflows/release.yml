name: Release Portable Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.7 or v2.8.0)"
        required: true
        type: string
      draft:
        description: "Create as draft release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "sbt"

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Build release portable zip
        id: build
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}".Trim() } else { "$env:GITHUB_REF_NAME".Trim() }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag must not be empty."
          }
          $ver = $tag -replace '^[vV]', ''
          .\dist\build-portable-zip.ps1 -AppVersion $ver
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip=target/jpackage/W10Wheel-$ver-x64.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha=target/jpackage/W10Wheel-$ver-x64.zip.sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.build.outputs.tag }}"
          $ver = "${{ steps.build.outputs.ver }}"
          $zip = "${{ steps.build.outputs.zip }}"
          $sha = "${{ steps.build.outputs.sha }}"
          $isDraft = ("${{ github.event_name }}" -eq "workflow_dispatch") -and ("${{ inputs.draft }}" -eq "true")

          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"

          if ($exists) {
            gh release upload $tag $zip $sha --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "gh release upload failed with exit code $LASTEXITCODE"
            }
          } else {
            $ghArgs = @("release", "create", $tag, $zip, $sha, "--title", "W10Wheel - $ver", "--generate-notes")
            if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $ghArgs += @("--target", $env:GITHUB_SHA)
            }
            if ($isDraft) {
              $ghArgs += "--draft"
            }
            & gh @ghArgs
            if ($LASTEXITCODE -ne 0) {
              throw "gh release create failed with exit code $LASTEXITCODE"
            }
          }
