name: Build Portable Package

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "sbt"

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Build portable zip
        shell: pwsh
        run: .\dist\build-portable-zip.ps1

      - name: Upload portable package artifact
        uses: actions/upload-artifact@v7
        with:
          name: W10Wheel-win-x64
          path: |
            target/jpackage/W10Wheel-*-x64.zip
            target/jpackage/W10Wheel-*-x64.zip.sha256
